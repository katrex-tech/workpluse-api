version: "3.8"

services:
  facedb:
    image: pgvector/pgvector:pg16
    container_name: workpulse_facedb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: facedb
    ports:
      - "5433:5432"
    volumes:
      - facedb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  face-service:
    build: .
    container_name: workpulse_face_service
    depends_on:
      facedb:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@facedb:5432/facedb"
      SYNC_DATABASE_URL: "postgresql://postgres:postgrespassword@facedb:5432/facedb"
      SECRET_KEY: "c908f9219b25dc4c85918ff88d313c907bc9d9e6e104a62173ea6e987c2f6d0f"
      API_KEYS: "wp_master_secret_key_2026,admin-secret-key"
      MATCH_THRESHOLD: "0.65"
      AMBIGUITY_MARGIN: "0.08"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data/thumbnails:/app/data/thumbnails
      - ./models/weights:/app/models/weights
    restart: unless-stopped

volumes:
  facedb_data:
